name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make check

  test:
    runs-on: ubuntu-latest
    services:
      db_test:
        # Keep in sync with docker/compose.db-test.yml and docker/db-test.env
        # (make migrate-test reads the latter; pytest uses pyproject's pytest-env).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: eggs
          POSTGRES_PASSWORD: eggs
          POSTGRES_DB: doorstep_eggs_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U eggs -d doorstep_eggs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make migrate-test
      - run: make test
