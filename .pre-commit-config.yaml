# Local hooks so tool versions come from uv.lock, not a second pin here.
repos:
  - repo: local
    hooks:
      # Lint before format: lint fixes can leave code that needs reformatting.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      # Whole project, not just staged files: a change can break types elsewhere.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
