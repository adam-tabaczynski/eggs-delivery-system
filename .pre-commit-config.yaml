# Local hook so ruff's version comes from uv.lock, not a second pin here.
repos:
  - repo: local
    hooks:
      # Lint before format: lint fixes can leave code that needs reformatting.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
