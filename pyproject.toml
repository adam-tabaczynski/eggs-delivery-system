[project]
name = "doorstep-eggs"
version = "0.1.0"
description = "Single-provider egg delivery portal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-env>=1.7.0",
    "ruff>=0.16.9",
]

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"

include = ["src", "tests"]

# Analysis Level
typeCheckingMode = "standard"     # Options: "off", "basic", "standard", "strict"

# Pragmatic Strictness Overrides (Enforce clean code without excessive noise)
reportImplicitStringConcatenation = false   # Useful for multi-line SQL/prompts
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportMissingTypeStubs = false              # Prevents errors for third-party libraries without stubs
reportUnknownArgumentType = false
reportUnknownMemberType = false

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to live in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder makes ruff treat the library as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

env = [
    "POSTGRES_USER=eggs",
    "POSTGRES_PASSWORD=eggs",
    "POSTGRES_HOST=localhost",
    "POSTGRES_PORT=5433",
    "POSTGRES_DB=doorstep_eggs_test",
]

# Execution Flags
addopts = [
    "--strict-markers",        # Treat unregistered custom markers (@pytest.mark.xxx) as errors
    "--strict-config",         # Fail fast if there's a typo in pytest configuration files
    "-ra",                     # Show extra summary info for (r)esults: (a)ll except passed
    "--tb=short",              # Concise traceback formatting (great for terminal & Claude Code)
    "--disable-warnings",      # Keeps terminal output clean from 3rd-party deprecation warnings
]

# File & Function Naming Conventions
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
